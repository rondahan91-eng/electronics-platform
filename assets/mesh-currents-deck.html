document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lumns:minmax(0,1fr) 860px;gap:80px;align-items:center;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:28px;\">\n<div style=\"font-size:30px;font-weight:700;color:#cbd2ee;letter-spacing:.04em;\">שיטות לפתרון מעגלים · 9.1<\u002Fdiv>\n<h1 style=\"margin:0;font-size:120px;font-weight:800;line-height:1.02;\">שיטת זרמי החוגים<\u002Fh1>\n<p style=\"margin:0;font-size:40px;line-height:1.4;color:#dfe3f5;text-wrap:pretty;\">פתרון שיטתי למעגלים עם כמה לולאות ושני מקורות מתח<\u002Fp>\n<\u002Fdiv>\n<dc-import name=\"Circuit\" mode=\"loops\" style=\"width:860px;height:420px;\" hint-size=\"860px,420px\"><\u002Fdc-import>\n<\u002Fsection>\n\n<section data-label=\"02 מפת השיעור\" data-screen-label=\"02\" data-speaker-notes=\"חמישה חלקים: מוטיבציה, הרעיון, בניית המשוואות, דוגמה מלאה, ולסיום הכנה לבגרות.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:60px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">שיטת זרמי החוגים<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">מפת השיעור<\u002Fh2><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:0;\">\n<div style=\"display:grid;grid-template-columns:110px minmax(0,1fr);align-items:baseline;padding:26px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:48px;font-weight:800;color:#2fb2e6;\">01<\u002Fspan><span style=\"font-size:40px;font-weight:600;\">מעגל שהכלים הקודמים לא פותרים<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:110px minmax(0,1fr);align-items:baseline;padding:26px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:48px;font-weight:800;color:#2fb2e6;\">02<\u002Fspan><span style=\"font-size:40px;font-weight:600;\">הרעיון: זרם לולאה מדומה<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:110px minmax(0,1fr);align-items:baseline;padding:26px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:48px;font-weight:800;color:#2fb2e6;\">03<\u002Fspan><span style=\"font-size:40px;font-weight:600;\">בניית משוואת לולאה וקביעת סימנים<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:110px minmax(0,1fr);align-items:baseline;padding:26px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:48px;font-weight:800;color:#2fb2e6;\">04<\u002Fspan><span style=\"font-size:40px;font-weight:600;\">דוגמה מפורטת, מהמעגל ועד הבדיקה<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:110px minmax(0,1fr);align-items:baseline;padding:26px 0;border-top:2px solid #d5d9e8;border-bottom:2px solid #d5d9e8;\"><span style=\"font-size:48px;font-weight:800;color:#2fb2e6;\">05<\u002Fspan><span style=\"font-size:40px;font-weight:600;\">תוצאה שלילית וסדר פעולות לבגרות<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"03 מוטיבציה\" data-screen-label=\"03\" data-speaker-notes=\"לבקש מהתלמידים לנסות לצמצם את המעגל לנגד שקול. הם יגלו שאין זוג נגדים בטור או במקביל.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:52px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">מבוא<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">מעגל שהכלים הקודמים לא פותרים<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1;display:grid;grid-template-columns:minmax(0,1fr) 900px;gap:70px;align-items:center;\">\n<div style=\"display:flex;flex-direction:column;gap:34px;\">\n<p style=\"margin:0;font-size:36px;line-height:1.45;text-wrap:pretty;\">R1 ו-R3 אינם בטור: בצומת שביניהם יוצא הענף של R2.<\u002Fp>\n<p style=\"margin:0;font-size:36px;line-height:1.45;text-wrap:pretty;\">אף זוג נגדים אינו מחובר במקביל.<\u002Fp>\n<p style=\"margin:0;font-size:36px;line-height:1.45;text-wrap:pretty;\">שני מקורות מתח בלולאות שונות, עם ענף משותף. אי אפשר לצמצם לנגד שקול אחד.<\u002Fp>\n<p style=\"margin:0;padding-top:30px;border-top:2px solid #d5d9e8;font-size:36px;line-height:1.45;font-weight:700;text-wrap:pretty;\">צריך דרך שיטתית, הבנויה על חוק קירכהוף למתחים.<\u002Fp>\n<\u002Fdiv>\n<dc-import name=\"Circuit\" mode=\"plain\" r1=\"R1=1Ω\" r2=\"R2=3Ω\" r3=\"R3=2Ω\" e1=\"12V\" e2=\"2V\" style=\"width:900px;height:440px;\" hint-size=\"900px,440px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"04 זרם לולאה מדומה\" data-screen-label=\"04\" data-speaker-notes=\"לולאה בלתי-תלויה: כל אחת מהשתיים הפנימיות. הכיוון שבוחרים שרירותי, אבל אותו כיוון לכולן.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:52px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">הרעיון<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">זרם לולאה מדומה<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1;display:grid;grid-template-columns:minmax(0,1fr) 900px;gap:70px;align-items:center;\">\n<div style=\"display:flex;flex-direction:column;gap:34px;\">\n<div style=\"display:flex;gap:20px;align-items:baseline;\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#ff9f43;\"><\u002Fspan><p style=\"margin:0;font-size:36px;line-height:1.45;text-wrap:pretty;\">בכל לולאה בלתי-תלויה מגדירים זרם לולאה אחד: I1, I2.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:20px;align-items:baseline;\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#b18cff;\"><\u002Fspan><p style=\"margin:0;font-size:36px;line-height:1.45;text-wrap:pretty;\">כל הלולאות באותו כיוון סבב. כאן: כיוון השעון.<\u002Fp><\u002Fdiv>\n<div style=\"display:flex;gap:20px;align-items:baseline;\"><span style=\"flex:none;width:22px;height:22px;border-radius:50%;background:#39ff8f;border:2px solid #1c8a5a;box-sizing:border-box;\"><\u002Fspan><p style=\"margin:0;font-size:36px;line-height:1.45;text-wrap:pretty;\">אלה זרמי עזר. את הזרם האמיתי בכל ענף מחשבים מהם בסוף.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Circuit\" mode=\"loops\" style=\"width:900px;height:440px;\" hint-size=\"900px,440px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"05 ענף יחיד וענף משותף\" data-screen-label=\"05\" data-speaker-notes=\"להצביע על R2 בשרטוט: הכתום יורד, הסגול עולה. לכן הפרש ולא סכום.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:52px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">הרעיון<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">ענף יחיד וענף משותף<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1;display:grid;grid-template-columns:minmax(0,1fr) 900px;gap:70px;align-items:center;\">\n<div style=\"display:flex;flex-direction:column;gap:40px;\">\n<div style=\"display:flex;flex-direction:column;gap:12px;\">\n<div style=\"font-size:30px;font-weight:700;color:#5b6389;\">ענף של לולאה אחת · R1, R3<\u002Fdiv>\n<div style=\"font-size:36px;line-height:1.4;\">הזרם האמיתי הוא זרם הלולאה עצמו.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px;padding-top:40px;border-top:2px solid #d5d9e8;\">\n<div style=\"font-size:30px;font-weight:700;color:#5b6389;\">ענף משותף · R2<\u002Fdiv>\n<div style=\"font-size:36px;line-height:1.4;text-wrap:pretty;\">שני זרמי הלולאה עוברים בו בכיוונים מנוגדים, ולכן הזרם האמיתי הוא ההפרש:<\u002Fdiv>\n<div dir=\"ltr\" style=\"align-self:flex-end;font-family:Consolas,'Courier New',monospace;font-size:60px;font-weight:700;display:flex;gap:20px;\"><span style=\"color:#157a4c;\">I(R2)<\u002Fspan><span>=<\u002Fspan><span style=\"color:#b85600;\">I1<\u002Fspan><span>−<\u002Fspan><span style=\"color:#6a3fd6;\">I2<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Circuit\" mode=\"loops\" style=\"width:900px;height:440px;\" hint-size=\"900px,440px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"06 הצורה הסטנדרטית\" data-screen-label=\"06\" data-speaker-notes=\"זה חוק קירכהוף למתחים, רק מסודר לפי הנעלמים. המקדם המשותף תמיד בסימן מינוס כשכל הלולאות באותו כיוון סבב.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:60px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">בניית המשוואות<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">משוואת לולאה בצורה הסטנדרטית<\u002Fh2><\u002Fdiv>\n<div dir=\"ltr\" style=\"display:flex;flex-direction:column;gap:30px;align-items:center;font-family:Consolas,'Courier New',monospace;font-size:60px;font-weight:700;\">\n<div style=\"display:grid;grid-template-columns:420px 70px 360px 70px 260px;align-items:center;text-align:center;padding:24px 40px;background:#ffffff;border-radius:20px;\">\n<span style=\"color:#b85600;\">ΣR₁·I₁<\u002Fspan><span>−<\u002Fspan><span>Rm·I₂<\u002Fspan><span>=<\u002Fspan><span>ΣE₁<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:420px 70px 360px 70px 260px;align-items:center;text-align:center;padding:24px 40px;background:#ffffff;border-radius:20px;\">\n<span>−Rm·I₁<\u002Fspan><span>+<\u002Fspan><span style=\"color:#6a3fd6;\">ΣR₂·I₂<\u002Fspan><span>=<\u002Fspan><span>ΣE₂<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:64px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px;\">\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div dir=\"ltr\" style=\"text-align:right;font-family:Consolas,'Courier New',monospace;font-size:40px;font-weight:700;\">ΣR<\u002Fdiv><div style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">מקדם עצמי: סכום ההתנגדויות בלולאה<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div dir=\"ltr\" style=\"text-align:right;font-family:Consolas,'Courier New',monospace;font-size:40px;font-weight:700;\">Rm<\u002Fdiv><div style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">מקדם משותף: ההתנגדות בענף המשותף, תמיד עם מינוס<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;\"><div dir=\"ltr\" style=\"text-align:right;font-family:Consolas,'Courier New',monospace;font-size:40px;font-weight:700;\">ΣE<\u002Fdiv><div style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">מקור המתח הנטו בלולאה, לפי כיוון הסבב<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"07 סימן מקור המתח\" data-screen-label=\"07\" data-speaker-notes=\"זו הטעות הנפוצה ביותר. מקור מקבל סימן חיובי רק אם הוא דוחף זרם בכיוון הסבב שבחרנו לאותה לולאה.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:52px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">בניית המשוואות<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">סימן מקור המתח מול כיוון הסבב<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:60px; >\n<path d=\"M90,140 L90,40 L340,40 L340,280 L90,280 L90,180\" fill=\"none\" stroke=\"#5b6a90\" stroke-width=\"6\"><\u002Fpath>\n<line x1=\"72\" y1=\"150\" x2=\"108\" y2=\"150\" stroke=\"#ffcc33\" stroke-width=\"11\"><\u002Fline>\n<line x1=\"56\" y1=\"172\" x2=\"124\" y2=\"172\" stroke=\"#ffcc33\" stroke-width=\"6\"><\u002Fline>\n<text x=\"40\" y=\"200\" text-anchor=\"end\" font-family=\"Consolas,monospace\" font-size=\"34\" font-weight=\"700\" fill=\"#ffcc33\">+<\u002Ftext>\n<path d=\"M130,240 L130,80 L300,80 L300,240 Z\" fill=\"none\" stroke=\"#ff9f43\" stroke-width=\"6\" stroke-dasharray=\"16 20\"><\u002Fpath>\n<polygon points=\"116,172 144,172 130,146\" fill=\"#ff9f43\"><\u002Fpolygon>\n<polygon points=\"203,66 203,94 229,80\" fill=\"#ff9f43\"><\u002Fpolygon>\n<polygon points=\"286,148 314,148 300,174\" fill=\"#ff9f43\"><\u002Fpolygon>\n<polygon points=\"229,226 229,254 203,240\" fill=\"#ff9f43\"><\u002Fpolygon>\n<text x=\"215\" y=\"174\" text-anchor=\"middle\" font-family=\"Consolas,monospace\" font-size=\"48\" font-weight=\"700\" fill=\"#ff6b6b\">−E<\u002Ftext>\n<\u002Fsvg>\n<\u002Fdiv>\n<div style=\"font-size:34px;line-height:1.4;text-wrap:pretty;\">המקור דוחף זרם נגד כיוון הסבב: <span dir=\"ltr\" style=\"font-family:Consolas,'Courier New',monospace;font-weight:700;\">−E<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin:44px 0 0;font-size:32px;line-height:1.45;color:#5b6389;text-wrap:pretty;\">מקור דוחף זרם החוצה מהקוטב החיובי. הסימן נקבע לפי ההתאמה לכיוון הסבב, לא לפי העובדה שזה מקור.<\u002Fp>\n<\u002Fsection>\n\n<section data-label=\"08 דוגמה: המעגל והנתונים\" data-screen-label=\"08\" data-speaker-notes=\"לציין במפורש את ההנחה: שני זרמי הלולאה בכיוון השעון, וכל מקור דוחף בכיוון הסבב של הלולאה שלו.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:52px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">דוגמה מפורטת<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">המעגל והנתונים<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1;display:grid;grid-template-columns:minmax(0,1fr) 900px;gap:70px;align-items:center;\">\n<div style=\"display:flex;flex-direction:column;gap:40px;\">\n<div dir=\"ltr\" style=\"display:grid;grid-template-columns:repeat(3,auto);justify-content:end;gap:18px 48px;font-family:Consolas,'Courier New',monospace;font-size:44px;font-weight:700;\">\n<span>R1 = 1Ω<\u002Fspan><span>R2 = 3Ω<\u002Fspan><span>R3 = 2Ω<\u002Fspan>\n<span style=\"color:#97650f;\">E1 = 12V<\u002Fspan><span style=\"color:#97650f;\">E2 = 2V<\u002Fspan><span><\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px;padding-top:36px;border-top:2px solid #d5d9e8;\">\n<div style=\"font-size:30px;font-weight:700;color:#5b6389;\">הנחות הפתרון<\u002Fdiv>\n<p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">I1 ו-I2 שניהם בכיוון השעון.<\u002Fp>\n<p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">כל מקור דוחף זרם בכיוון הסבב של הלולאה שלו.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Circuit\" mode=\"loops\" r1=\"R1=1Ω\" r2=\"R2=3Ω\" r3=\"R3=2Ω\" e1=\"12V\" e2=\"2V\" style=\"width:900px;height:440px;\" hint-size=\"900px,440px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"09 משוואת לולאה 1 · שלב 1\" data-screen-label=\"09\" data-speaker-notes=\"מתחילים מהמקדם העצמי: כל הנגדים שהלולאה הכתומה עוברת דרכם.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:52px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">דוגמה -size:40px;font-weight:700;color:#6a3fd6;\">I2<\u002Fspan><span dir=\"ltr\" style=\"text-align:right;font-family:Consolas,'Courier New',monospace;font-size:44px;font-weight:700;color:#157a4c;\">4A<\u002Fspan><\u002Fdiv>\n<div data-in=\"3\" style=\"display:grid;grid-template-columns:minmax(0,1fr) 260px 170px;align-items:baseline;padding:26px 0;border-bottom:2px solid #d5d9e8;\"><span style=\"font-size:36px;font-weight:600;\">R2 · ענף משותף<\u002Fspan><span dir=\"ltr\" style=\"text-align:right;font-family:Consolas,'Courier New',monospace;font-size:40px;font-weight:700;\">I1 − I2<\u002Fspan><span dir=\"ltr\" style=\"text-align:right;font-family:Consolas,'Courier New',monospace;font-size:44px;font-weight:700;color:#157a4c;\">2A<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Circuit\" mode=\"loops\" r1=\"R1=1Ω\" r2=\"R2=3Ω\" r3=\"R3=2Ω\" e1=\"12V\" e2=\"2V\" i1=\"I1=6A\" i2=\"I2=4A\" style=\"width:860px;height:420px;\" hint-size=\"860px,420px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"17 הזרמים האמיתיים במעגל\" data-screen-label=\"17\" data-speaker-notes=\"לחכות לאנימציה: הכתום והסגול בענף המשותף מתמזגים לזרם ירוק אחד של 2A כלפי מטה. בענפים R1 ו-R3 הצבע רק מתחלף.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:40px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">דוגמה מפורטת<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">הזרמים האמיתיים במעגל<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:36px;\">\n<dc-import name=\"Circuit\" mode=\"merge\" r1=\"R1=1Ω\" r2=\"R2=3Ω\" r3=\"R3=2Ω\" e1=\"12V\" e2=\"2V\" i1=\"I1=6A\" i2=\"I2=4A\" ia=\"6A\" ib=\"2A\" ic=\"4A\" dur-a=\"0.6s\" dur-b=\"1.8s\" dur-c=\"0.9s\" style=\"width:1100px;height:520px;\" hint-size=\"1100px,520px\"><\u002Fdc-import>\n<div style=\"display:flex;gap:48px;align-items:center;font-size:32px;\">\n<span style=\"display:flex;gap:14px;align-items:center;\"><span style=\"width:40px;height:8px;border-radius:4px;background:#ff9f43;\"><\u002Fspan><span style=\"white-space:nowrap;\">I1 יורד ב-R2<\u002Fspan><\u002Fspan>\n<span style=\"display:flex;gap:14px;align-items:center;\"><span style=\"width:40px;height:8px;border-radius:4px;background:#b18cff;\"><\u002Fspan><span>I2 עולה ב-R2<\u002Fspan><\u002Fspan>\n<span style=\"display:flex;gap:14px;align-items:center;\"><span style=\"width:40px;height:8px;border-radius:4px;background:#1fbf6a;\"><\u002Fspan><span style=\"font-weight:700;\">זרם אמיתי: 2A כלפי מטה<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"18 בדיקה בצומת\" data-screen-label=\"18\" data-speaker-notes=\"בדיקה עם חוק קירכהוף לזרמים בצומת העליון: מה שנכנס שווה למה שיוצא.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:52px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">דוגמה מפורטת<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">בדיקה: חוק קירכהוף לזרמים בצומת<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:70px;align-items:center;\">\n<div style=\"display:flex;flex-direction:column;gap:40px;\">\n<div data-in=\"1\" style=\"display:grid;grid-template-columns:260px minmax(0,1fr);align-items:center;gap:30px;\"><span style=\"font-size:32px;font-weight:700;color:#5b6389;\">נכנס לצומת<\u002Fspan><div dir=\"ltr\" style=\"display:flex;justify-content:flex-end;gap:18px;font-family:Consolas,'Courier New',monospace;font-size:48px;font-weight:700;\"><span style=\"padding:10px 26px;border-radius:14px;background:#ffffff;border:3px solid #39ff8f;\">6A · R1<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div data-in=\"2\" style=\"display:grid;grid-template-columns:260px minmax(0,1fr);align-items:center;gap:30px;\"><span style=\"font-size:32px;font-weight:700;color:#5b6389;\">יוצא מהצומת<\u002Fspan><div dir=\"ltr\" style=\"display:flex;justify-content:flex-end;align-items:center;gap:18px;font-family:Consolas,'Courier New',monospace;font-size:48px;font-weight:700;\"><span style=\"padding:10px 26px;border-radius:14px;background:#ffffff;border:3px solid #39ff8f;\">2A · R2<\u002Fspan><span>+<\u002Fspan><span style=\"padding:10px 26px;border-radius:14px;background:#ffffff;border:3px solid #39ff8f;\">4A · R3<\u002Fspan><\u002Fdiv><\u002Fdiv>\n<div data-in=\"3\" dir=\"ltr\" style=\"align-self:flex-end;padding:24px 44px;border-radius:18px;background:#dff7ea;font-family:Consolas,'Courier New',monospace;font-size:64px;font-weight:700;color:#157a4c;\">2A + 4A = 6A  ✓<\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Circuit\" mode=\"real\" r1=\"R1=1Ω\" r2=\"R2=3Ω\" r3=\"R3=2Ω\" e1=\"12V\" e2=\"2V\" ia=\"6A\" ib=\"2A\" ic=\"4A\" dur-a=\"0.6s\" dur-b=\"1.8s\" dur-c=\"0.9s\" style=\"width:820px;height:400px;\" hint-size=\"820px,400px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"19 תוצאה שלילית\" data-screen-label=\"19\" data-speaker-notes=\"מעגל אחר: E2 הפוך, דוחף נגד הסבב של לולאה 2. I2 יוצא שלילי. לא טעות, וגם לא פותרים מחדש. רק הופכים את החץ בתשובה.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:48px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">לבגרות<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">משמעות זרם לולאה שלילי<\u002Fh2><\u002Fdiv>\n<div style=\"flex:1;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:70px;align-items:center;\">\n<div style=\"display:flex;flex-direction:column;gap:30px;\">\n<div style=\"font-size:30px;line-height:1.4;color:#5b6389;text-wrap:pretty;\">כל הנגדים 2Ω, E1 = 10V. המקור E2 = 8V דוחף נגד הסבב של לולאה 2.<\u002Fdiv>\n<div dir=\"ltr\" style=\"align-self:flex-end;display:flex;flex-direction:column;gap:14px;font-family:Consolas,'Courier New',monospace;font-size:42px;font-weight:700;text-align:right;\">\n<span>4·I1 − 2·I2 = 10<\u002Fspan>\n<span>−2·I1 + 4·I2 = <span style=\"color:#c23b3f;\">−8<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div dir=\"ltr\" style=\"align-self:flex-end;font-family:Consolas,'Courier New',monospace;font-size:48px;font-weight:700;\"><span style=\"color:#b85600;\">I1 = 2A<\u002Fspan>     <span style=\"color:#6a3fd6;\">I2 = −1A<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:16px;padding-top:28px;border-top:2px solid #d5d9e8;\">\n<p style=\"margin:0;font-size:32px;line-height:1.45;text-wrap:pretty;\">המינוס אומר שהזרם ב-R3 זורם בפועל נגד כיוון השעון, 1A.<\u002Fp>\n<p style=\"margin:0;font-size:32px;line-height:1.45;text-wrap:pretty;\">לא פותרים מחדש. ב-R2: <span dir=\"ltr\" style=\"font-family:Consolas,'Courier New',monospace;font-weight:700;\">2 − (−1) = 3A<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<dc-import name=\"Circuit\" mode=\"real\" r1=\"R1=2Ω\" r2=\"R2=2Ω\" r3=\"R3=2Ω\" e1=\"10V\" e2=\"8V\" e2-flip=\"{{ true }}\" r3-rev=\"{{ true }}\" ia=\"2A\" ib=\"3A\" ic=\"1A\" dur-a=\"1.2s\" dur-b=\"0.8s\" dur-c=\"2.4s\" style=\"width:820px;height:400px;\" hint-size=\"820px,400px\"><\u002Fdc-import>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"20 סדר פעולות לבגרות\" data-screen-label=\"20\" data-speaker-notes=\"שבעה שלבים קבועים לכל שאלת זרמי חוגים בבחינה.\" style=\"background:#eef0f6;color:#212a4d;padding:90px 110px 80px;display:flex;flex-direction:column;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:52px;\"><div style=\"font-size:26px;font-weight:700;color:#5b6389;letter-spacing:.04em;\">לבגרות<\u002Fdiv><h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.1;\">סדר פעולות לשאלת בגרות<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:column;grid-template-rows:repeat(4,auto);gap:0 80px;\">\n<div style=\"display:grid;grid-template-columns:70px minmax(0,1fr);align-items:baseline;padding:24px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:40px;font-weight:800;color:#2fb2e6;\">1<\u002Fspan><span style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">לזהות את הלולאות הבלתי-תלויות ולהגדיר זרם לכל אחת, באותו כיוון סבב<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:70px minmax(0,1fr);align-items:baseline;padding:24px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:40px;font-weight:800;color:#2fb2e6;\">2<\u002Fspan><span style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">לבדוק את כיוון כל מקור מתח יחסית לכיוון הסבב שנבחר<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:70px minmax(0,1fr);align-items:baseline;padding:24px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:40px;font-weight:800;color:#2fb2e6;\">3<\u002Fspan><span style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">לכתוב משוואת חוק קירכהוף למתחים לכל לולאה, בצורה הסטנדרטית<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:70px minmax(0,1fr);align-items:baseline;padding:24px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:40px;font-weight:800;color:#2fb2e6;\">4<\u002Fspan><span style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">לפתור את מערכת המשוואות<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:70px minmax(0,1fr);align-items:baseline;padding:24px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:40px;font-weight:800;color:#2fb2e6;\">5<\u002Fspan><span style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">להמיר לזרמים אמיתיים בענפים (ענף משותף = הפרש)<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:70px minmax(0,1fr);align-items:baseline;padding:24px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:40px;font-weight:800;color:#2fb2e6;\">6<\u002Fspan><span style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">אם זרם לולאה שלילי, להפוך את כיוון החץ בתשובה הסופית<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:70px minmax(0,1fr);align-items:baseline;padding:24px 0;border-top:2px solid #d5d9e8;\"><span style=\"font-size:40px;font-weight:800;color:#2fb2e6;\">7<\u002Fspan><span style=\"font-size:32px;line-height:1.4;text-wrap:pretty;\">לבדוק באמצעות חוק קירכהוף לזרמים בצומת<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"21 בקצרה\" data-screen-label=\"21\" data-speaker-notes=\"סיכום: זרמי עזר, חוק קירכהוף למתחים מסודר, והמרה לזרמים אמיתיים.\" style=\"background:#262c56;color:#f4f5fb;padding:100px 110px;display:flex;flex-direction:column;justify-content:center;font-family:'Assistant','Segoe UI',Arial,sans-serif;direction:rtl;box-sizing:border-box;\">\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:64px;\"><div style=\"font-size:26px;font-weight:700;color:#cbd2ee;letter-spacing:.04em;\">שיטת זרמי החוגים<\u002Fdiv><h2 style=\"margin:0;font-size:80px;font-weight:800;line-height:1.1;\">בקצרה<\u002Fh2><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:60px;\">\n<div style=\"display:flex;flex-direction:column;gap:20px;padding-top:30px;border-top:6px solid #ff9f43;\"><span style=\"font-size:38px;font-weight:800;\">זרמי עזר<\u002Fspan><span style=\"font-size:32px;line-height:1.45;color:#dfe3f5;text-wrap:pretty;\">זרם מדומה אחד לכל לולאה, כולם באותו כיוון סבב.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px;padding-top:30px;border-top:6px solid #b18cff;\"><span style=\"font-size:38px;font-weight:800;\">משוואה לכל לולאה<\u002Fspan><span style=\"font-size:32px;line-height:1.45;color:#dfe3f5;text-wrap:pretty;\">חוק קירכהוף למתחים: מקדם עצמי, מינוס מקדם משותף, שווה ל-E הנטו.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px;padding-top:30px;border-top:6px solid #39ff8f;\"><span style=\"font-size:38px;font-weight:800;\">זרמים אמיתיים<\u002Fspan><span style=\"font-size:32px;line-height:1.45;color:#dfe3f5;text-wrap:pretty;\">ענף יחיד מקבל את זרם הלולאה, ענף משותף את ההפרש. זרם שלילי פירושו כיוון הפוך.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
