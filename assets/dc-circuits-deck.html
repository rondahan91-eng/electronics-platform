document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

5;\">קצב צריכת האנרגיה<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:32px 24px;display:flex;flex-direction:column;gap:18px;min-height:300px;box-shadow:0 10px 36px rgba(20,16,48,.06);\">\n      <div style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:#5b6389;\">03<\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:800;line-height:1.15;\">חוקי קירכהוף<\u002Fdiv>\n      <div style=\"font-size:26px;color:#5b6389;line-height:1.35;\">לולאה וצומת<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:32px 24px;display:flex;flex-direction:column;gap:18px;min-height:300px;box-shadow:0 10px 36px rgba(20,16,48,.06);\">\n      <div style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:#5b6389;\">04<\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:800;line-height:1.15;\">מעגל טורי<\u002Fdiv>\n      <div style=\"font-size:26px;color:#5b6389;line-height:1.35;\">הזרם משותף<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:32px 24px;display:flex;flex-direction:column;gap:18px;min-height:300px;box-shadow:0 10px 36px rgba(20,16,48,.06);\">\n      <div style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:#5b6389;\">05<\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:800;line-height:1.15;\">מעגל מקבילי<\u002Fdiv>\n      <div style=\"font-size:26px;color:#5b6389;line-height:1.35;\">המתח משותף<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:32px 24px;display:flex;flex-direction:column;gap:18px;min-height:300px;box-shadow:0 10px 36px rgba(20,16,48,.06);\">\n      <div style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:#5b6389;\">06<\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:800;line-height:1.15;\">מעגל מעורב<\u002Fdiv>\n      <div style=\"font-size:26px;color:#5b6389;line-height:1.35;\">צמצום שלב-שלב<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:32px 24px;display:flex;flex-direction:column;gap:18px;min-height:300px;box-shadow:0 10px 36px rgba(20,16,48,.06);\">\n      <div style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;color:#5b6389;\">07<\u002Fdiv>\n      <div style=\"font-size:34px;font-weight:800;line-height:1.15;\">מקורות ומפסק<\u002Fdiv>\n      <div style=\"font-size:26px;color:#5b6389;line-height:1.35;\">מעגל לכל מצב<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 03 Ohm -->\n<section data-label=\"חוק אום\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>01 · חוק אום<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">חוק אום<\u002Fh2>\n  <div style=\"margin-top:52px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:80px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:36px;\">\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">בכל רכיב בודד במעגל, המתח עליו V, הזרם דרכו I וההתנגדות שלו R קשורים תמיד באותו יחס:<\u002Fp>\n      <div style=\"direction:ltr;unicode-bidi:isolate;align-self:flex-start;font-family:Consolas,'IBM Plex Mono',monospace;font-size:72px;font-weight:600;color:#212a4d;background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:32px 56px;box-shadow:0 10px 36px rgba(20,16,48,.08);\">I = V / R<\u002Fdiv>\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">ככל שההתנגדות גדולה יותר, אותו מתח דוחף זרם קטן יותר. R היא מידת ההתנגדות של הרכיב לזרימת המטען.<\u002Fp>\n      <p style=\"margin:0;font-size:30px;line-height:1.45;color:#5b6389;text-wrap:pretty;\">בגרף V-I של נגד מתקבל קו ישר, והשיפוע שלו הוא R.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0b0e17;border-radius:24px;box-shadow:0 10px 36px rgba(20,16,48,.22);\">\n      <svg direction=\"ltr\" sc-camel-view-box=\"0 0 820 600\" style=\"display:block;width:100%;direction:ltr;\">\n        <line x1=\"120\" y1=\"500\" x2=\"760\" y2=\"500\" stroke=\"#9fb0d0\" stroke-width=\"3\"><\u002Fline>\n        <line x1=\"120\" y1=\"500\" x2=\"120\" y2=\"60\" stroke=\"#9fb0d0\" stroke-width=\"3\"><\u002Fline>\n        <line x1=\"120\" y1=\"380\" x2=\"760\" y2=\"380\" stroke=\"#1a2036\" stroke-width=\"2\"><\u002Fline>\n        <line x1=\"120\" y1=\"260\" x2=\"760\" y2=\"260\" stroke=\"#1a2036\" stroke-width=\"2\"><\u002Fline>\n        <line x1=\"120\" y1=\"140\" x2=\"760\" y2=\"140\" stroke=\"#1a2036\" stroke-width=\"2\"><\u002Fline>\n        <text x=\"100\" y=\"391\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#9fb0d0\">8<\u002Ftext>\n        <text x=\"100\" y=\"271\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#9fb0d0\">16<\u002Ftext>\n        <text x=\"100\" y=\"151\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#9fb0d0\">24<\u002Ftext>\n        <text x=\"300\" y=\"545\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#9fb0d0\">1<\u002Ftext>\n        <text x=\"480\" y=\"545\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#9fb0d0\">2<\u002Ftext>\n        <text x=\"660\" y=\"545\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#9fb0d0\">3<\u002Ftext>\n        <text x=\"770\" y=\"545\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#eaf2ff\">I (A)<\u002Ftext>\n        <text x=\"140\" y=\"70\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#eaf2ff\">V (V)<\u002Ftext>\n        <line x1=\"120\" y1=\"500\" x2=\"700\" y2=\"113\" stroke=\"#00e5ff\" stroke-width=\"6\" stroke-linecap=\"round\" filter=\"url(#dcglow)\"><\u002Fline>\n        <line x1=\"480\" y1=\"500\" x2=\"480\" y2=\"260\" stroke=\"#39ff8f\" stroke-width=\"2\" stroke-dasharray=\"8 8\"><\u002Fline>\n        <line x1=\"120\" y1=\"260\" x2=\"480\" y2=\"260\" stroke=\"#39ff8f\" stroke-width=\"2\" stroke-dasharray=\"8 8\"><\u002Fline>\n        <circle cx=\"480\" cy=\"260\" r=\"11\" fill=\"#39ff8f\" filter=\"url(#dcglow)\"><\u002Fcircle>\n        <text x=\"560\" y=\"300\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#00e5ff\">R = 8Ω<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 04 Ohm example -->\n<section data-label=\"חוק אום: דוגמה\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>01 · חוק אום<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">חוק אום: דוגמה<\u002Fh2>\n  <div style=\"margin-top:52px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:80px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:36px;\">\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">נגד של 8Ω מחובר למקור מתח של 16V. מהו הזרם במעגל?<\u002Fp>\n      <div style=\"font-size:28px;font-weight:700;color:#5b6389;\">פתרון<\u002Fdiv>\n      <div style=\"direction:ltr;unicode-bidi:isolate;align-self:flex-start;font-family:Consolas,'IBM Plex Mono',monospace;font-size:60px;font-weight:600;color:#212a4d;background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:28px 48px;box-shadow:0 10px 36px rgba(20,16,48,.08);\">I = 16V / 8Ω = 2A<\u002Fdiv>\n      <p style=\"margin:0;font-size:30px;line-height:1.45;color:#5b6389;text-wrap:pretty;\">זו הנקודה המסומנת בגרף V-I של השקף הקודם.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#0b0e17;border-radius:24px;box-shadow:0 10px 36px rgba(20,16,48,.22);\">\n      <svg direction=\"ltr\" sc-camel-view-box=\"0 0 820 600\" style=\"display:block;width:100%;direction:ltr;\">\n        <path d=\"M200,285 V140 H350 M470,140 H620 V460 H200 V315\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n        <g transform=\"translate(410,140)\"><polyline points=\"-60,0 -45,0 -36,-16 -18,16 0,-16 18,16 36,-16 45,0 60,0\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fg>\n        <line x1=\"164\" y1=\"285\" x2=\"236\" y2=\"285\" stroke=\"#ffcc33\" stroke-width=\"6\"><\u002Fline>\n        <line x1=\"182\" y1=\"315\" x2=\"218\" y2=\"315\" stroke=\"#ffcc33\" stroke-width=\"12\"><\u002Fline>\n        <text x=\"410\" y=\"95\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">R = 8Ω<\u002Ftext>\n        <text x=\"140\" y=\"312\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">16V<\u002Ftext>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(620,300) rotate(90)\"><\u002Fpath>\n        <text x=\"650\" y=\"312\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#39ff8f\">I = ?<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 05 Power -->\n<section data-label=\"הספק חשמלי\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>02 · הספק חשמלי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">הספק חשמלי<\u002Fh2>\n  <p style=\"margin:52px 0 0;font-size:34px;line-height:1.45;max-width:1400px;text-wrap:pretty;\">הספק P מתאר כמה אנרגיה נצרכת ביחידת זמן. ההגדרה הבסיסית היא מכפלת המתח בזרם. הצבת חוק אום נותנת שתי צורות שקולות נוספות, שימושיות כשחסר אחד מהגדלים.<\u002Fp>\n  <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;\">\n    <div style=\"display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"font-size:28px;font-weight:700;color:#5b6389;\">ההגדרה<\u002Fdiv>\n      <div style=\"direction:ltr;unicode-bidi:isolate;text-align:center;font-family:Consolas,'IBM Plex Mono',monospace;font-size:72px;font-weight:600;color:#ffffff;background:#212a4d;border-radius:20px;padding:56px 24px;\">P = V · I<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.4;\">כשידועים V ו-I<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"font-size:28px;font-weight:700;color:#5b6389;\">מציבים את V<\u002Fdiv>\n      <div style=\"direction:ltr;unicode-bidi:isolate;text-align:center;font-family:Consolas,'IBM Plex Mono',monospace;font-size:72px;font-weight:600;color:#212a4d;background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:56px 24px;box-shadow:0 10px 36px rgba(20,16,48,.08);\">P = I² · R<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.4;\">כשידועים I ו-R<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:22px;\">\n      <div style=\"font-size:28px;font-weight:700;color:#5b6389;\">מציבים את I<\u002Fdiv>\n      <div style=\"direction:ltr;unicode-bidi:isolate;text-align:center;font-family:Consolas,'IBM Plex Mono',monospace;font-size:72px;font-weight:600;color:#212a4d;background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:56px 24px;box-shadow:0 10px 36px rgba(20,16,48,.08);\">P = V² / R<\u002Fdiv>\n      <div style=\"font-size:30px;line-height:1.4;\">כשידועים V ו-R<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 06 Power example -->\n<section data-label=\"הספק חשמלי: דוגמה\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>02 · הספק חשמלי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">הספק חשמלי: דוגמה<\u002Fh2>\n  <div style=\"margin-top:52px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:80px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:36px;\">\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">בנגד של 10Ω זורם זרם של 2A. מהו ההספק?<\u002Fp>\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">ידועים I ו-R, ולכן בוחרים בצורה:<\u002Fp>\n      <div style=\"direction:ltr;unicode-bidi:isolate;align-self:flex-start;font-family:Consolas,'IBM Plex Mono',monospace;font-size:56px;font-weight:600;color:#5b6389;background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:24px 44px;\">P = I² · R<\u002Fdiv>\n      <div style=\"font-size:28px;font-weight:700;color:#5b6389;\">פתרון<\u002Fdiv>\n      <div style=\"direction:ltr;unicode-bidi:isolate;align-self:flex-start;font-family:Consolas,'IBM Plex Mono',monospace;font-size:60px;font-weight:600;color:#212a4d;background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:28px 48px;box-shadow:0 10px 36px rgba(20,16,48,.08);\">P = 4 × 10 = 40W<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0b0e17;border-radius:24px;box-shadow:0 10px 36px rgba(20,16,48,.22);\">\n      <svg direction=\"ltr\" sc-camel-view-box=\"0 0 820 600\" style=\"display:block;width:100%;direction:ltr;\">\n        <path d=\"M200,285 V140 H350 M470,140 H620 V460 H200 V315\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n        <g transform=\"translate(410,140)\"><polyline points=\"-60,0 -45,0 -36,-16 -18,16 0,-16 18,16 36,-16 45,0 60,0\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fg>\n        <line x1=\"164\" y1=\"285\" x2=\"236\" y2=\"285\" stroke=\"#ffcc33\" stroke-width=\"6\"><\u002Fline>\n        <line x1=\"182\" y1=\"315\" x2=\"218\" y2=\"315\" stroke=\"#ffcc33\" stroke-width=\"12\"><\u002Fline>\n        <text x=\"410\" y=\"95\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">R = 10Ω<\u002Ftext>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(620,300) rotate(90)\"><\u002Fpath>\n        <text x=\"650\" y=\"312\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#39ff8f\">2A<\u002Ftext>\n        <text x=\"410\" y=\"230\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#ffcc33\">P = ?<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 07 Kirchhoff -->\n<section data-label=\"חוקי קירכהוף\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>03 · חוקי קירכהוף<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">חוקי קירכהוף<\u002Fh2>\n  <p style=\"margin:28px 0 0;font-size:32px;line-height:1.45;color:#5b6389;max-width:1500px;text-wrap:pretty;\">שני חוקי שימור שתקפים בכל מעגל. כל נוסחאות הטור, המקביל והמעגל המעורב הן מקרה פרטי שלהם.<\u002Fp>\n  <div style=\"margin-top:32px;flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;\">\n    <div style=\"background:#ffffff;border:1px solid #e1e3ee;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 36px rgba(20,16,48,.06);\">\n      <div style=\"background:#0b0e17;border-radius:18px;\">\n        <svg direction=\"ltr\" sc-camel-view-box=\"0 0 600 330\" style=\"display:block;width:100%;direction:ltr;\">\n          <path d=\"M80,152 V60 H240 M360,60 H520 V140 M520,240 V300 H80 V178\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n          <g transform=\"translate(300,60)\"><polyline points=\"-60,0 -45,0 -36,-16 -18,16 0,-16 18,16 36,-16 45,0 60,0\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fg>\n          <g transform=\"translate(520,190)\"><polyline points=\"0,-50 0,-38 -16,-30 16,-15 -16,0 16,15 -16,30 0,38 0,50\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fg>\n          <line x1=\"50\" y1=\"152\" x2=\"110\" y2=\"152\" stroke=\"#ffcc33\" stroke-width=\"6\"><\u002Fline>\n          <line x1=\"65\" y1=\"178\" x2=\"95\" y2=\"178\" stroke=\"#ffcc33\" stroke-width=\"12\"><\u002Fline>\n          <text x=\"140\" y=\"176\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#eaf2ff\">E<\u002Ftext>\n          <text x=\"300\" y=\"124\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#eaf2ff\">V1<\u002Ftext>\n          <text x=\"470\" y=\"200\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#eaf2ff\">V2<\u002Ftext>\n          <text x=\"300\" y=\"232\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#9fb0d0\">לולאה<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:36px;font-weight:800;\">חוק המתחים · בלולאה<\u002Fdiv>\n      <p style=\"margin:0;font-size:30px;line-height:1.4;text-wrap:pretty;\">בכל לולאה סגורה, כל המתח שהמקור נותן מתבזבז בדיוק על הרכיבים שבה, בלי שארית.<\u002Fp>\n      <div style=\"margin-top:auto;direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;background:#f4f3f8;border-radius:14px;padding:12px 28px;text-align:center;\">E = V1 + V2<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#ffffff;border:1px solid #e1e3ee;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 36px rgba(20,16,48,.06);\">\n      <div style=\"background:#0b0e17;border-radius:18px;\">\n        <svg direction=\"ltr\" sc-camel-view-box=\"0 0 600 330\" style=\"display:block;width:100%;direction:ltr;\">\n          <path d=\"M60,165 H300 L540,60 M300,165 L540,270\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n          <circle cx=\"300\" cy=\"165\" r=\"12\" fill=\"#eaf2ff\"><\u002Fcircle>\n          <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(170,165)\"><\u002Fpath>\n          <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(430,108) rotate(-23.6)\"><\u002Fpath>\n          <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(430,222) rotate(23.6)\"><\u002Fpath>\n          <text x=\"170\" y=\"130\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I1<\u002Ftext>\n          <text x=\"410\" y=\"70\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I2<\u002Ftext>\n          <text x=\"410\" y=\"290\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I3<\u002Ftext>\n          <text x=\"300\" y=\"215\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#9fb0d0\">צומת<\u002Ftext>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-size:36px;font-weight:800;\">חוק הזרמים · בצומת<\u002Fdiv>\n      <p style=\"margin:0;font-size:30px;line-height:1.4;text-wrap:pretty;\">סכום הזרמים הנכנסים לצומת שווה לסכום היוצאים ממנו. מטען לא מצטבר ולא נעלם, הוא רק מתפצל או מתאחד.<\u002Fp>\n      <div style=\"margin-top:auto;direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;background:#f4f3f8;border-radius:14px;padding:12px 28px;text-align:center;\">I1 = I2 + I3<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 08 Series -->\n<section data-label=\"מעגל טורי\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>04 · מעגל טורי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל טורי<\u002Fh2>\n  <div style=\"margin-top:52px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 860px;gap:80px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:40px;\">\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">רכיבים בטור מחוברים ברצף, בלי פיצול. אותו זרם I בדיוק זורם בכולם.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid #d9dceb;\">\n        <div style=\"display:grid;grid-template-columns:260px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid #d9dceb;\"><span style=\"font-size:34px;font-weight:800;\">הזרם<\u002Fspan><span style=\"font-size:34px;\">משותף לכל הרכיבים<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:260px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid #d9dceb;\"><span style=\"font-size:34px;font-weight:800;\">ההתנגדויות<\u002Fspan><span style=\"font-size:34px;\">מצטרפות<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:260px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid #d9dceb;\"><span style=\"font-size:34px;font-weight:800;\">המתח<\u002Fspan><span style=\"font-size:34px;\">מתחלק ביחס ישר להתנגדויות<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0b0e17;border-radius:24px;box-shadow:0 10px 36px rgba(20,16,48,.22);\">\n      <svg direction=\"ltr\" sc-camel-view-box=\"0 0 900 600\" style=\"display:block;width:100%;direction:ltr;\">\n        <path d=\"M140,285 V140 H280 M400,140 H540 M660,140 H780 V480 H140 V315\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n        <g transform=\"translate(340,140)\"><polyline points=\"-60,0 -45,0 -36,-16 -18,16 0,-16 18,16 36,-16 45,0 60,0\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fg>\n        <g transform=\"translate(600,140)\"><polyline points=\"-60,0 -45,0 -36,-16 -18,16 0,-16 18,16 36,-16 45,0 60,0\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fg>\n        <line x1=\"104\" y1=\"285\" x2=\"176\" y2=\"285\" stroke=\"#ffcc33\" stroke-width=\"6\"><\u002Fline>\n        <line x1=\"122\" y1=\"315\" x2=\"158\" y2=\"315\" stroke=\"#ffcc33\" stroke-width=\"12\"><\u002Fline>\n        <text x=\"340\" y=\"95\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">R1<\u002Ftext>\n        <text x=\"600\" y=\"95\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">R2<\u002Ftext>\n        <text x=\"80\" y=\"312\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">V<\u002Ftext>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(210,140)\"><\u002Fpath>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(470,140)\"><\u002Fpath>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(780,310) rotate(90)\"><\u002Fpath>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(460,480) rotate(180)\"><\u002Fpath>\n        <text x=\"210\" y=\"195\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I<\u002Ftext>\n        <text x=\"470\" y=\"195\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I<\u002Ftext>\n        <text x=\"740\" y=\"320\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I<\u002Ftext>\n        <text x=\"460\" y=\"440\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 09 Series derivation -->\n<section data-label=\"מעגל טורי: ההתנגדות השקולה\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>04 · מעגל טורי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל טורי: ההתנגדות השקולה<\u002Fh2>\n  <div style=\"margin-top:52px;display:flex;flex-direction:column;border-top:1px solid #d9dceb;\">\n    <div style=\"display:grid;grid-template-columns:80px 700px minmax(0,1fr);gap:32px;align-items:center;padding:26px 0;border-bottom:1px solid #d9dceb;\">\n      <span style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:#5b6389;\">1<\u002Fspan>\n      <span style=\"font-size:34px;\">חוק קירכהוף למתחים:<\u002Fspan>\n      <span style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:52px;font-weight:600;\">V = V1 + V2<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 700px minmax(0,1fr);gap:32px;align-items:center;padding:26px 0;border-bottom:1px solid #d9dceb;\">\n      <span style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:#5b6389;\">2<\u002Fspan>\n      <span style=\"font-size:34px;\">חוק אום בכל איבר, באותו I:<\u002Fspan>\n      <span style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:52px;font-weight:600;\">V = I·R1 + I·R2<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 700px minmax(0,1fr);gap:32px;align-items:center;padding:26px 0;border-bottom:1px solid #d9dceb;\">\n      <span style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:#5b6389;\">3<\u002Fspan>\n      <span style=\"font-size:34px;\">מוציאים I כגורם משותף:<\u002Fspan>\n      <span style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:52px;font-weight:600;\">V = I·(R1 + R2)<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;display:grid;grid-template-columns:80px 700px minmax(0,1fr);gap:32px;align-items:center;\">\n    <span><\u002Fspan>\n    <span style=\"font-size:34px;font-weight:800;\">ולכן:<\u002Fspan>\n    <div style=\"direction:ltr;unicode-bidi:isolate;text-align:center;font-family:Consolas,'IBM Plex Mono',monospace;font-size:60px;font-weight:600;color:#ffffff;background:#212a4d;border-radius:20px;padding:36px 32px;\">R total = R1 + R2 + ... + Rn<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 10 Voltage division -->\n<section data-label=\"מעגל טורי: חלוקת המתח\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>04 · מעגל טורי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל טורי: חלוקת המתח<\u002Fh2>\n  <div style=\"margin-top:52px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:80px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:36px;\">\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">אותו זרם I עובר בכל הרכיבים, אבל ההתנגדויות שונות. לכן, לפי חוק אום, גם המתחים שונים.<\u002Fp>\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">המתח הכולל מתחלק ביחס ישר להתנגדות: רכיב עם התנגדות גדולה יותר סופג חלק גדול יותר.<\u002Fp>\n      <div style=\"direction:ltr;unicode-bidi:isolate;align-self:flex-start;display:flex;flex-direction:column;gap:18px;font-family:Consolas,'IBM Plex Mono',monospace;font-size:56px;font-weight:600;background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:32px 48px;box-shadow:0 10px 36px rgba(20,16,48,.08);\">\n        <span>V1 = V · R1 / R total<\u002Fspan>\n        <span>V2 = V · R2 / R total<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#212a4d;color:#ffffff;border-radius:24px;padding:48px;display:flex;flex-direction:column;gap:28px;\">\n      <div style=\"font-size:28px;font-weight:700;color:#cfd5f0;\">מקרה פרטי<\u002Fdiv>\n      <div style=\"font-size:40px;font-weight:800;line-height:1.3;\">חלוקה שווה של המתח<\u002Fdiv>\n      <p style=\"margin:0;font-size:32px;line-height:1.45;color:#e4e7f7;text-wrap:pretty;\">קורית רק כשההתנגדויות שוות זו לזו. זו לא תוצאה כללית, ואי אפשר להניח אותה בלי לבדוק.<\u002Fp>\n      <div style=\"direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:40px;font-weight:600;color:#57c7f2;display:flex;flex-direction:column;gap:12px;\">\n        <span>R1 = R2<\u002Fspan>\n        <span>V1 = V2 = V / 2<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 11 Series example -->\n<section data-label=\"מעגל טורי: דוגמה\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>04 · מעגל טורי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל טורי: דוגמה<\u002Fh2>\n  <div style=\"margin-top:44px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 820px;gap:72px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:22px;\">\n      <p style=\"margin:0 0 10px;font-size:34px;line-height:1.45;text-wrap:pretty;\">שני נגדים, 5Ω ו-15Ω, בטור למקור של 40V.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;border-top:1px solid #d9dceb;\">\n        <div style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;padding:18px 0;border-bottom:1px solid #d9dceb;\">R total = 5 + 15 = 20Ω<\u002Fdiv>\n        <div style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;padding:18px 0;border-bottom:1px solid #d9dceb;\">I = 40V / 20Ω = 2A<\u002Fdiv>\n        <div style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;padding:18px 0;border-bottom:1px solid #d9dceb;\">V1 = 2A × 5Ω = 10V<\u002Fdiv>\n        <div style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;padding:18px 0;border-bottom:1px solid #d9dceb;\">V2 = 2A × 15Ω = 30V<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:12px;\">\n        <span style=\"font-size:30px;font-weight:700;color:#5b6389;\">בדיקה לפי חוק קירכהוף למתחים:<\u002Fspan>\n        <span style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;\">10V + 30V = 40V<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;f ;overflow:hidden;height:96px;\">\n        <div style=\"background:#57c7f2;color:#212a4d;display:flex;align-items:center;justify-content:center;font-family:Consolas,'IBM Plex Mono',monospace;font-size:34px;font-weight:600;\">10V<\u002Fdiv>\n        <div style=\"background:#212a4d;color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:Consolas,'IBM Plex Mono',monospace;font-size:34px;font-weight:600;\">30V<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:28px;color:#5b6389;\">40V מתחלקים ביחס 1:3, כמו ההתנגדויות<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 12 Parallel -->\n<section data-label=\"מעגל מקבילי\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>05 · מעגל מקבילי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל מקבילי<\u002Fh2>\n  <div style=\"margin-top:52px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 860px;gap:80px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:40px;\">\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">רכיבים במקביל מחוברים בין שתי נקודות משותפות. אותו מתח V בדיוק מופיע על כל ענף, והזרם מתפצל בין הענפים.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:0;border-top:1px solid #d9dceb;\">\n        <div style=\"display:grid;grid-template-columns:260px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid #d9dceb;\"><span style=\"font-size:34px;font-weight:800;\">המתח<\u002Fspan><span style=\"font-size:34px;\">משותף לכל הענפים<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:260px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid #d9dceb;\"><span style=\"font-size:34px;font-weight:800;\">ההתנגדות<\u002Fspan><span style=\"font-size:34px;\">השקולה קטנה יותר<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:260px 1fr;gap:24px;padding:26px 0;border-bottom:1px solid #d9dceb;\"><span style=\"font-size:34px;font-weight:800;\">הזרם<\u002Fspan><span style=\"font-size:34px;\">מתחלק ביחס הפוך להתנגדויות<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0b0e17;border-radius:24px;box-shadow:0 10px 36px rgba(20,16,48,.22);\">\n      <svg direction=\"ltr\" sc-camel-view-box=\"0 0 900 600\" style=\"display:block;width:100%;direction:ltr;\">\n        <path d=\"M140,285 V120 H720 M140,315 V480 H720 M460,120 V240 M460,360 V480 M720,120 V240 M720,360 V480\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n        <g transform=\"translate(460,300)\"><polyline points=\"0,-60 0,-45 -16,-36 16,-18 -16,0 16,18 -16,36 0,45 0,60\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fg>\n        <g transform=\"translate(720,300)\"><polyline points=\"0,-60 0,-45 -16,-36 16,-18 -16,0 16,18 -16,36 0,45 0,60\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline><\u002Fg>\n        <line x1=\"104\" y1=\"285\" x2=\"176\" y2=\"285\" stroke=\"#ffcc33\" stroke-width=\"6\"><\u002Fline>\n        <line x1=\"122\" y1=\"315\" x2=\"158\" y2=\"315\" stroke=\"#ffcc33\" stroke-width=\"12\"><\u002Fline>\n        <text x=\"80\" y=\"312\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">V<\u002Ftext>\n        <text x=\"500\" y=\"295\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">R1<\u002Ftext>\n        <text x=\"500\" y=\"335\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#00e5ff\">V<\u002Ftext>\n        <text x=\"760\" y=\"295\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">R2<\u002Ftext>\n        <text x=\"760\" y=\"335\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"30\" fill=\"#00e5ff\">V<\u002Ftext>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(300,120)\"><\u002Fpath>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(460,180) rotate(90)\"><\u002Fpath>\n        <path d=\"M-16,-13 L16,0 L-16,13 Z\" fill=\"#39ff8f\" transform=\"translate(720,180) rotate(90)\"><\u002Fpath>\n        <text x=\"300\" y=\"80\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I<\u002Ftext>\n        <text x=\"420\" y=\"192\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I1<\u002Ftext>\n        <text x=\"680\" y=\"192\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">I2<\u002Ftext>\n      <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 13 Parallel derivation -->\n<section data-label=\"מעגל מקבילי: ההתנגדות השקולה\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>05 · מעגל מקבילי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל מקבילי: ההתנגדות השקולה<\u002Fh2>\n  <div style=\"margin-top:52px;display:flex;flex-direction:column;border-top:1px solid #d9dceb;\">\n    <div style=\"display:grid;grid-template-columns:80px 700px minmax(0,1fr);gap:32px;align-items:center;padding:26px 0;border-bottom:1px solid #d9dceb;\">\n      <span style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:#5b6389;\">1<\u002Fspan>\n      <span style=\"font-size:34px;\">חוק קירכהוף לזרמים:<\u002Fspan>\n      <span style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:52px;font-weight:600;\">I = I1 + I2<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 700px minmax(0,1fr);gap:32px;align-items:center;padding:26px 0;border-bottom:1px solid #d9dceb;\">\n      <span style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:#5b6389;\">2<\u002Fspan>\n      <span style=\"font-size:34px;\">חוק אום בכל ענף, באותו V:<\u002Fspan>\n      <span style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:52px;font-weight:600;\">I = V/R1 + V/R2<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px 700px minmax(0,1fr);gap:32px;align-items:center;padding:26px 0;border-bottom:1px solid #d9dceb;\">\n      <span style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:34px;font-weight:600;color:#5b6389;\">3<\u002Fspan>\n      <span style=\"font-size:34px;\">מוציאים V כגורם משותף:<\u002Fspan>\n      <span style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:52px;font-weight:600;\">I = V·(1/R1 + 1/R2)<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;display:grid;grid-template-columns:80px 700px minmax(0,1fr);gap:32px;align-items:center;\">\n    <span><\u002Fspan>\n    <span style=\"font-size:34px;font-weight:800;\">ולכן:<\u002Fspan>\n    <div style=\"direction:ltr;unicode-bidi:isolate;text-align:center;font-family:Consolas,'IBM Plex Mono',monospace;font-size:56px;font-weight:600;color:#ffffff;background:#212a4d;border-radius:20px;padding:36px 32px;\">1/R total = 1/R1 + 1/R2 + ... + 1/Rn<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 14 Two resistors -->\n<section data-label=\"מעגל מקבילי: שני נגדים\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>05 · מעגל מקבילי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל מקבילי: שני נגדים<\u002Fh2>\n  <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:56px;\">\n    <p style=\"margin:0;font-size:34px;line-height:1.45;\">לשני נגדים בלבד יש נוסחה מקוצרת:<\u002Fp>\n    <div style=\"direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:96px;font-weight:600;color:#212a4d;background:#ffffff;border:1px solid #e1e3ee;border-radius:28px;padding:48px 88px;box-shadow:0 10px 36px rgba(20,16,48,.08);\">R total = (R1 × R2) / (R1 + R2)<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#212a4d;color:#ffffff;border-radius:24px;padding:40px 48px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:center;\">\n    <div style=\"font-size:40px;font-weight:800;\">תמיד קטנה יותר<\u002Fdiv>\n    <p style=\"margin:0;font-size:32px;line-height:1.45;color:#e4e7f7;text-wrap:pretty;\">ההתנגדות השקולה במקביל קטנה תמיד מהקטנה שבהתנגדויות הבודדות, כי נפתח עוד נתיב לזרם.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 15 Current division -->\n<section data-label=\"מעגל מקבילי: חלוקת הזרם\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>05 · מעגל מקבילי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל מקבילי: חלוקת הזרם<\u002Fh2>\n  <div style=\"margin-top:52px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 720px;gap:80px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:36px;\">\n      <p style=\"margin:0;font-size:34px;line-height:1.45;text-wrap:pretty;\">בניגוד לטור, כאן הזרם הוא שמתחלק, וביחס הפוך להתנגדות: ענף עם התנגדות קטנה מעביר יותר זרם.<\u002Fp>\n      <div style=\"direction:ltr;unicode-bidi:isolate;align-self:flex-start;display:flex;flex-direction:column;gap:18px;font-family:Consolas,'IBM Plex Mono',monospace;font-size:56px;font-weight:600;background:#ffffff;border:1px solid #e1e3ee;border-radius:20px;padding:32px 48px;box-shadow:0 10px 36px rgba(20,16,48,.08);\">\n        <div style=\"display:flex;gap:0;\"><span>I1 = I · <\u002Fspan><span style=\"color:#ffffff;background:#2fb2e6;border-radius:10px;padding:0 10px;margin:0 6px;\">R2<\u002Fspan><span> / (R1 + R2)<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:0;\"><span>I2 = I · <\u002Fspan><span style=\"color:#ffffff;background:#2fb2e6;border-radius:10px;padding:0 10px;margin:0 6px;\">R1<\u002Fspan><span> / (R1 + R2)<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:32px;line-height:1.45;text-wrap:pretty;\">בנוסחה של I1 מופיעה R2, ההתנגדות של הענף האחר. זה מה שהופך את החלוקה להפוכה.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:#212a4d;color:#ffffff;border-radius:24px;padding:48px;display:flex;flex-direction:column;gap:28px;\">\n      <div style=\"font-size:28px;font-weight:700;color:#cfd5f0;\">מקרה פרטי<\u002Fdiv>\n      <div style=\"font-size:40px;font-weight:800;line-height:1.3;\">חלוקה שווה של הזרם<\u002Fdiv>\n      <p style=\"margin:0;font-size:32px;line-height:1.45;color:#e4e7f7;text-wrap:pretty;\">קורית רק כששתי ההתנגדויות שוות זו לזו. זו לא תוצאה כללית, ואי אפשר להניח אותה בלי לבדוק.<\u002Fp>\n      <div style=\"direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:40px;font-weight:600;color:#57c7f2;display:flex;flex-direction:column;gap:12px;\">\n        <span>R1 = R2<\u002Fspan>\n        <span>I1 = I2 = I / 2<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 16 Parallel example A (morph) -->\n<section data-label=\"מעגל מקבילי: דוגמה\" data-morph=\"par\" dir=\"rtl\" style=\"background:#f4f3f8;font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#212a4d;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <div style=\"font-size:26px;font-weight:700;color:#5b6389;display:flex;align-items:center;gap:14px;\"><span style=\"width:14px;height:14px;background:#57c7f2;border-radius:3px;display:block;\"><\u002Fspan><span>05 · מעגל מקבילי<\u002Fspan><\u002Fdiv>\n  <h2 style=\"margin:16px 0 0;font-size:64px;font-weight:800;line-height:1.15;\">מעגל מקבילי: דוגמה<\u002Fh2>\n  <div style=\"margin-top:44px;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 860px;gap:72px;align-items:start;\">\n    <div style=\"display:flex;flex-direction:column;gap:22px;\">\n      <p style=\"margin:0 0 10px;font-size:34px;line-height:1.45;text-wrap:pretty;\">נגדים של 6Ω ו-12Ω במקביל. הזרם הכולל שנכנס לצומת הוא 6A.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;border-top:1px solid #d9dceb;\">\n        <div style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;padding:18px 0;border-bottom:1px solid #d9dceb;\">R total = (6×12) / 18 = 4Ω<\u002Fdiv>\n        <div style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;padding:18px 0;border-bottom:1px solid #d9dceb;\">I1 = 6A × 12/18 = 4A<\u002Fdiv>\n        <div style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;padding:18px 0;border-bottom:1px solid #d9dceb;\">I2 = 6A × 6/18 = 2A<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:14px;display:flex;flex-direction:column;gap:12px;\">\n        <span style=\"font-size:30px;font-weight:700;color:#5b6389;\">בדיקה לפי חוק קירכהוף לזרמים:<\u002Fspan>\n        <span style=\"direction:ltr;unicode-bidi:isolate;text-align:left;font-family:Consolas,'IBM Plex Mono',monospace;font-size:44px;font-weight:600;\">4A + 2A = 6A<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#0b0e17;border-radius:24px;box-shadow:0 10px 36px rgba(20,16,48,.22);\">\n      <svg direction=\"ltr\" sc-camel-view-box=\"0 0 900 600\" style=\"display:block;width:100%;direction:ltr;\">\n        <path d=\"M140,285 V120 H590 M140,315 V480 H590\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n        <path data-m=\"ext\" d=\"M590,120 H720 M590,480 H720\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\" style=\"opacity:1;\"><\u002Fpath>\n        <line x1=\"104\" y1=\"285\" x2=\"176\" y2=\"285\" stroke=\"#ffcc33\" stroke-width=\"6\"><\u002Fline>\n        <line x1=\"122\" y1=\"315\" x2=\"158\" y2=\"315\" stroke=\"#ffcc33\" stroke-width=\"12\"><\u002Fline>\n        <text x=\"80\" y=\"312\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">V<\u002Ftext>\n        <path data-m=\"imain\" d=\"M-22,-18 L22,0 L-22,18 Z\" fill=\"#39ff8f\" transform=\"translate(300,120)\" style=\"opacity:1;\"><\u002Fpath>\n        <text x=\"300\" y=\"78\" text-anchor=\"middle\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#39ff8f\">6A<\u002Ftext>\n        <g transform=\"translate(460,0)\">\n          <g data-m=\"b1\" style=\"transform:translateX(0px);opacity:1;\">\n            <path d=\"M0,120 V240 M0,360 V480\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n            <polyline transform=\"translate(0,300)\" points=\"0,-60 0,-45 -16,-36 16,-18 -16,0 16,18 -16,36 0,45 0,60\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline>\n            <text x=\"40\" y=\"312\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">6Ω<\u002Ftext>\n            <path d=\"M-20,-18 L20,0 L-20,18 Z\" fill=\"#39ff8f\" transform=\"translate(0,180) rotate(90)\"><\u002Fpath>\n            <text x=\"-36\" y=\"192\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"32\" fill=\"#39ff8f\">4A<\u002Ftext>\n          <\u002Fg>\n        <\u002Fg>\n        <g transform=\"translate(720,0)\">\n          <g data-m=\"b2\" style=\"transform:translateX(0px);opacity:1;\">\n            <path d=\"M0,120 V240 M0,360 V480\" fill=\"none\" stroke=\"#00e5ff\" stroke-width=\"5\" filter=\"url(#dcglow)\"><\u002Fpath>\n            <polyline transform=\"translate(0,300)\" points=\"0,-60 0,-45 -16,-36 16,-18 -16,0 16,18 -16,36 0,45 0,60\" fill=\"none\" stroke=\"#ffcc33\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpolyline>\n            <text x=\"40\" y=\"312\" text-anchor=\"start\" font-family=\"Consolas,'IBM Plex Mono',monospace\" font-size=\"34\" fill=\"#eaf2ff\">12Ω<\u002Ftext>\n            <path d=\"M-11,-10 L11,0 L-11,10 Z\" fill=\"#39ff8f\" transform=\"translate(0,180) rotate(90)\"><\u002Fpath>\n            <text x=\"-36\" y=\"192\" text-anchor=\"end\" font-family=\"Consolas,'IBM Plex Mono',monospace BM Plex Mono',monospace;font-size:52px;font-weight:600;color:#5b6389;\">5<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:36px;font-weight:800;\">חזרה אחורה<\u002Fspan><span style=\"font-size:28px;color:#5b6389;\">חלוקת מתח בטור וחלוקת זרם במקביל, עד כל רכיב.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:80px minmax(0,1fr);gap:24px;align-items:center;border-bottom:1px solid #d9dceb;\">\n      <span style=\"font-family:Consolas,'IBM Plex Mono',monospace;font-size:52px;font-weight:600;color:#5b6389;\">6<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:6px;\"><span style=\"font-size:36px;font-weight:800;\">הספק ובדיקה<\u002Fspan><span style=\"font-size:28px;color:#5b6389;\">מחשבים הספק, ובודקים סכומים לפי חוקי קירכהוף.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 25 Summary -->\n<section data-label=\"בקצרה\" dir=\"rtl\" style=\"background:linear-gradient(160deg,#1d2246 0%,#262c56 60%,#3a3868 100%);font-family:Assistant,'Segoe UI',Arial,sans-serif;color:#ffffff;padding:100px 100px 80px;box-sizing:border-box;display:flex;flex-direction:column;\">\n  <h2 style=\"margin:0;font-size:64px;font-weight:800;line-height:1.15;\">בקצרה<\u002Fh2>\n  <div style=\"margin-top:52px;flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:28px;\">\n    <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px;\">\n      <div style=\"font-size:36px;font-weight:800;\">חוק אום<\u002Fdiv>\n      <div style=\"font-size:28px;line-height:1.4;color:#d4d8ee;\">הבסיס לכל נוסחה אחרת.<\u002Fdiv>\n      <div style=\"margin-top:auto;direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:40px;font-weight:600;color:#57c7f2;\">I = V / R<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px;\">\n      <div style=\"font-size:36px;font-weight:800;\">הספק<\u002Fdiv>\n      <div style=\"font-size:28px;line-height:1.4;color:#d4d8ee;\">נגזר ממתח וזרם, בשלוש צורות שקולות.<\u002Fdiv>\n      <div style=\"margin-top:auto;direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:36px;font-weight:600;color:#57c7f2;\">P = V·I = I²·R = V²/R<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px;\">\n      <div style=\"font-size:36px;font-weight:800;\">חוקי קירכהוף<\u002Fdiv>\n      <div style=\"font-size:28px;line-height:1.4;color:#d4d8ee;\">מתחים בלולאה וזרמים בצומת. מהם נגזרות כל הנוסחאות.<\u002Fdiv>\n      <div style=\"margin-top:auto;direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:36px;font-weight:600;color:#57c7f2;\">ΣV = 0 · ΣI in = ΣI out<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px;\">\n      <div style=\"font-size:36px;font-weight:800;\">טור<\u002Fdiv>\n      <div style=\"font-size:28px;line-height:1.4;color:#d4d8ee;\">הזרם משותף. המתח מתחלק ביחס ישר להתנגדויות.<\u002Fdiv>\n      <div style=\"margin-top:auto;direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:36px;font-weight:600;color:#57c7f2;\">R total = R1 + R2<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px;\">\n      <div style=\"font-size:36px;font-weight:800;\">מקביל<\u002Fdiv>\n      <div style=\"font-size:28px;line-height:1.4;color:#d4d8ee;\">המתח משותף. הזרם מתחלק ביחס הפוך להתנגדויות.<\u002Fdiv>\n      <div style=\"margin-top:auto;direction:ltr;unicode-bidi:isolate;font-family:Consolas,'IBM Plex Mono',monospace;font-size:36px;font-weight:600;color:#57c7f2;\">1/R total = 1/R1 + 1/R2<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px;\">\n      <div style=\"font-size:36px;font-weight:800;\">מעורב, מקורות ומפסק<\u002Fdiv>\n      <div style=\"font-size:28px;line-height:1.4;color:#d4d8ee;\">צמצום שלב-שלב. כל מצב של מפסק וכל צירוף מקורות הוא מעגל נפרד.<\u002Fdiv>\n      <div style=\"margin-top:auto;font-size:28px;font-weight:700;color:#57c7f2;\">חלוקה שווה היא מקרה פרטי בלבד<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;morph&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Transitions&quot;},&quot;morphMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:900,&quot;min&quot;:300,&quot;max&quot;:2000,&quot;step&quot;:50,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Transitions&quot;}}\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    this.onChange = (e) => {\n      const d = e.detail || {};\n      const s = d.slide, p = d.previousSlide;\n      if (!s || !p || this.props.morph === false) return;\n      const g = s.getAttribute('data-morph');\n      if (!g || g !== p.getAttribute('data-morph')) return;\n      if (Math.abs(d.index - d.previousIndex) !== 1) return;\n      if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n      const dur = this.props.morphMs ?? 900;\n      const all = ['transform', 'opacity', 'stroke', 'fill'];\n      const items = [];\n      s.querySelectorAll('[data-m]').forEach((el) => {\n        const o = p.querySelector('[data-m=\"' + el.getAttribute('data-m') + '\"]');\n        if (!o) return;\n        const keys = all.filter((k) => el.style.getPropertyValue(k) || o.style.getPropertyValue(k));\n        if (!keys.length) return;\n        const cs = getComputedStyle(o);\n        const from = {}, orig = {};\n        keys.forEach((k) => { from[k] = cs.getPropertyValue(k); orig[k] = el.style.getPropertyValue(k); });\n        items.push({ el, keys, from, orig });\n      });\n      items.forEach(({ el, keys, from }) => {\n        el.style.transition = 'none';\n        keys.forEach((k) => el.style.setProperty(k, from[k]));\n      });\n      void s.getBoundingClientRect();\n      setTimeout(() => {\n        const ease = 'cubic-bezier(.65,0,.35,1)';\n        items.forEach(({ el, keys, orig }) => {\n          el.style.transition = keys.map((k) => k + ' ' + dur + 'ms ' + ease).join(',');\n          keys.forEach((k) => { if (orig[k]) el.style.setProperty(k, orig[k]); else el.style.removeProperty(k); });\n        });\n        clearTimeout(this.t);\n        this.t = setTimeout(() => items.forEach(({ el }) => { el.style.transition = ''; }), dur + 100);\n      }, 20);\n    };\n    document.addEventListener('slidechange', this.onChange);\n  }\n  componentWillUnmount() {\n    document.removeEventListener('slidechange', this.onChange);\n    clearTimeout(this.t);\n  }\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
